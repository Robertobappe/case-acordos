services:
  postgres:
    image: postgres:16
    container_name: acordos-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  sqs:
    image: softwaremill/elasticmq-native
    container_name: acordos-sqs
    ports:
      - "9324:9324"   # API compatível com SQS

volumes:
  pgdata:
